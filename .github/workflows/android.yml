name: Android

# Fase 10: APK de Android + prueba en emulador (teléfono y tablet).
# El APK queda como artefacto; las capturas del emulador se imprimen en el
# registro (base64) para poder revisarlas sin descargar nada.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (arm64, armv7, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencias del sistema (juceaide se compila para la máquina de CI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libgl1-mesa-dev

      - name: SDK de Android (NDK y CMake)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.31.6" > /dev/null

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --console=plain --no-daemon

      - name: Publicar APK (artefacto de CI)
        uses: actions/upload-artifact@v4
        with:
          name: KB-Musiquero-DJ-Android-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  emulador:
    name: Emulador (${{ matrix.device }})
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: telefono
            profile: pixel_6
          - device: tablet
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: KB-Musiquero-DJ-Android-${{ github.sha }}
          path: apk

      - name: Herramientas para las capturas
        run: sudo apt-get update && sudo apt-get install -y imagemagick ffmpeg

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash tools/android/emulator_smoke_test.sh apk ${{ matrix.device }}
