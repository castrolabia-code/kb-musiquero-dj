# Compila KB - MUSIQUERO DJ en Windows (producto) y Linux (pruebas), corre las
# pruebas unitarias y publica el ejecutable de Windows como artefacto descargable.
name: Build

# Push de un tag vX.Y.Z => además publica un Release con el ZIP descargable.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Configurar
        run: cmake --preset windows-x64-release

      - name: Compilar
        run: cmake --build --preset windows-x64-release --parallel

      - name: Pruebas
        run: ctest --preset windows-x64-release

      - name: Empaquetar (exe + runtime de Visual C++)
        shell: pwsh
        run: |
          cmake --install build/windows-x64-release --config Release --component app --prefix "dist/KB Musiquero DJ"
          Get-ChildItem "dist/KB Musiquero DJ" | Format-Table Name, Length
          if (-not (Test-Path "dist/KB Musiquero DJ/KB Musiquero DJ.exe")) { throw "Falta el exe" }
          if (-not (Test-Path "dist/KB Musiquero DJ/vcruntime140.dll"))   { throw "Faltan las DLL de Visual C++" }
          $name = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev" }
          Compress-Archive -Path "dist/KB Musiquero DJ" -DestinationPath "KB-Musiquero-DJ-$name-Windows-x64.zip"
          "ZIP_NAME=KB-Musiquero-DJ-$name-Windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Empaquetar generador de licencias (uso interno de Castro Labs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/KB Generador de Licencias" | Out-Null
          cmake --install build/windows-x64-release --config Release --component tools --prefix "dist/KB Generador de Licencias"
          Get-ChildItem "dist/KB Musiquero DJ" -Filter "*.dll" | Where-Object { $_.Name -match '^(vcruntime|msvcp|concrt)' } | Copy-Item -Destination "dist/KB Generador de Licencias"
          Copy-Item tools/license_generator/LEEME.txt "dist/KB Generador de Licencias/LEEME.txt"
          Get-ChildItem "dist/KB Generador de Licencias" | Format-Table Name, Length
          if (-not (Test-Path "dist/KB Generador de Licencias/KB Generador de Licencias.exe")) { throw "Falta el generador" }
          Compress-Archive -Path "dist/KB Generador de Licencias" -DestinationPath "KB-Generador-de-Licencias-Windows-x64.zip"

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION\s+(\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" "/DDistDir=..\dist\KB Musiquero DJ" installer\KBMusiqueroDJ.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }
          $setup = Get-ChildItem dist -Filter "KB-Musiquero-DJ-Setup-*.exe" | Select-Object -First 1
          "SETUP_NAME=dist/$($setup.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publicar instalador (artefacto de CI)
        uses: actions/upload-artifact@v4
        with:
          name: KB-Musiquero-DJ-Setup-${{ github.sha }}
          path: ${{ env.SETUP_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publicar generador de licencias (artefacto de CI, privado)
        uses: actions/upload-artifact@v4
        with:
          name: KB-Generador-de-Licencias-${{ github.sha }}
          path: KB-Generador-de-Licencias-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publicar ejecutable (artefacto de CI)
        uses: actions/upload-artifact@v4
        with:
          name: KB-Musiquero-DJ-windows-x64-${{ github.sha }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release (solo tags vX.Y.Z)
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ env.ZIP_NAME }}" "${{ env.SETUP_NAME }}" `
            --repo "${{ github.repository }}" `
            --title "KB - MUSIQUERO DJ ${{ github.ref_name }}" `
            --notes "Descargá el ZIP, descomprimilo y ejecutá 'KB Musiquero DJ.exe'. Ver CHANGELOG.md." `
            --prerelease

  linux:
    name: Linux (pruebas)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libgl1-mesa-dev

      - name: Configurar
        run: cmake --preset linux-debug

      - name: Compilar
        run: cmake --build --preset linux-debug --parallel

      - name: Pruebas
        run: ctest --preset linux-debug
