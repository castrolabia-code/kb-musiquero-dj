# Compila KB - MUSIQUERO DJ en Windows (producto) y Linux (pruebas), corre las
# pruebas unitarias y publica el ejecutable de Windows como artefacto descargable.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake --preset windows-x64-release

      - name: Compilar
        run: cmake --build --preset windows-x64-release --parallel

      - name: Pruebas
        run: ctest --preset windows-x64-release

      - name: Publicar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: KB-Musiquero-DJ-windows-x64-${{ github.sha }}
          path: build/windows-x64-release/src/app/KBMusiqueroDJ_artefacts/Release/
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux (pruebas)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libgl1-mesa-dev

      - name: Configurar
        run: cmake --preset linux-debug

      - name: Compilar
        run: cmake --build --preset linux-debug --parallel

      - name: Pruebas
        run: ctest --preset linux-debug
